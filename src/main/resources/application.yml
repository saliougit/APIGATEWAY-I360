server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: ipay-service
          uri: http://localhost:8081
          predicates:
            - Path=/ipay/**
        - id: ibanking-service
          uri: http://localhost:8082
          predicates:
            - Path=/ibanking/**

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: yourSecretKeyHereMustBeVeryLongAndSecure
  expiration: 86400000  # 24 hours in milliseconds

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

# Configuration pour SpringDoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true
    enabled: true
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Gateway
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: true
  packages-to-scan: com.innov4africa.api_gateway.controller

# Configuration URLs for OpenAPI
openapi:
  dev-url: http://localhost:8080

keycloak:
  auth-server-url: https://137.184.94.79:8443/auth
  realm: Ibanking
  resource: ibanking-backoffice
  ssl-required: external
  use-resource-role-mappings: true
  verify-token-audience: true
  credentials:
    secret: your-client-secret
  admin:
    realm: Ibanking
    username: admin
    password: admin
    client-id: ibanking-backoffice